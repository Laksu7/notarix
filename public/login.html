<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NOTARIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='18' fill='%23102d50'/%3E%3Cpath d='M58.5 12.5h20.6l8.4 8.6v23.4h-29z' fill='none' stroke='%23F8F7F2' stroke-width='4.6' stroke-linejoin='round'/%3E%3Cpath d='M66 28.5h13.5M66 35.5h13.5M66 42.5h9' stroke='%23F8F7F2' stroke-width='3.7' stroke-linecap='round'/%3E%3Ctext x='15' y='83' font-family='Georgia,serif' font-weight='700' font-size='62' fill='%23F8F7F2'%3EN%3C/text%3E%3Cellipse cx='48' cy='58' rx='41' ry='14.5' transform='rotate(-16 48 58)' stroke='%23C5A45D' stroke-width='4' pathLength='100' stroke-dasharray='0 30 55 15' fill='none'/%3E%3Cpath d='M36.5 75.5C33.4 62 42 49.5 50.6 45.3l7.2 6.6c-1.4 11.4-10.4 21.6-20 25.3z' fill='%23C5A45D'/%3E%3C/svg%3E">
</head>
<body class="login-page">

  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-veil" aria-hidden="true"></div>
  <div class="login-halo" aria-hidden="true"></div>
  <div class="corner tl" aria-hidden="true"></div>
  <div class="corner br" aria-hidden="true"></div>

  <div class="login-wrap">
    <div class="login-brand">
      <div id="lockup"></div>
      <div class="login-word">NOTARIX</div>
      <p class="login-tag"><b>Digitalized Notarization</b>Record Management System</p>
      <div class="login-ver">v2.0 &nbsp;·&nbsp; Updated Oct 29</div>
    </div>

    <div class="login-card">
      <h2>Welcome Back!</h2>
      <p class="login-sub">Sign in to your account</p>

      <div id="alertBox"></div>

      <form id="loginForm" novalidate>
        <div class="login-field">
          <span class="lead" data-icon="user"></span>
          <input class="input" type="text" id="username" placeholder="Username or email" autocomplete="username" required>
        </div>
        <div class="login-field">
          <span class="lead" data-icon="lock"></span>
          <input class="input" type="password" id="password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="login-eye" id="eyeBtn" aria-label="Show password" data-icon="eye"></button>
        </div>
        <button type="submit" class="btn btn-navy btn-block login-submit" id="loginBtn">
          <span id="loginBtnLabel">Login</span>
        </button>
        <p class="contact-admin">Don't have an account? <b>Contact your admin.</b></p>
      </form>
    </div>
  </div>

<script src="js/app.js"></script>
<script>
  /* logo lockup + field icons */
  document.getElementById('lockup').innerHTML = notarixMark(118, 'dark');
  document.querySelectorAll('[data-icon="user"]').forEach(el => el.innerHTML = ICONS.user);
  document.querySelectorAll('[data-icon="lock"]').forEach(el => el.innerHTML = ICONS.lock);
  document.querySelectorAll('[data-icon="eye"]').forEach(el => el.innerHTML = ICONS.eye);

  /* session check */
  if (localStorage.getItem('notarium_logged_out') !== '1') {
    fetch('/api/auth/me').then(r => { if (r.ok) location.href = 'dashboard.html'; });
  }
  localStorage.removeItem('notarium_logged_out');

  const form = document.getElementById('loginForm');
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  const btn = document.getElementById('loginBtn');
  const label = document.getElementById('loginBtnLabel');
  const alertBox = document.getElementById('alertBox');

  /* password visibility toggle */
  const eyeBtn = document.getElementById('eyeBtn');
  eyeBtn.addEventListener('click', () => {
    const show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    eyeBtn.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
    eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    passEl.focus();
  });

  function invalidate(el) { el.classList.add('input-invalid'); }
  [userEl, passEl].forEach(el => el.addEventListener('input', () => el.classList.remove('input-invalid')));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertBox.innerHTML = '';
    let bad = false;
    if (!userEl.value.trim()) { invalidate(userEl); bad = true; }
    if (!passEl.value) { invalidate(passEl); bad = true; }
    if (bad) { alertBox.innerHTML = '<div class="alert error">Please enter your username and password.</div>'; return; }

    btn.disabled = true;
    label.innerHTML = '<span class="spinner"></span>&nbsp; Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEl.value.trim(), password: passEl.value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed. Please try again.');
      location.href = 'dashboard.html';
    } catch (err) {
      btn.disabled = false;
      label.textContent = 'Login';
      alertBox.innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
