<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Status &amp; Location — NOTARIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="menuBtn" aria-label="Open menu"></button>
<aside id="sidebar" class="sidebar"></aside>
<div id="scrim" class="scrim"></div>

<main class="main">
  <header class="topbar" id="topbar"></header>

  <div class="page-outer">
    <header class="page-head">
      <h1>Document Status &amp; Location</h1>
      <p>Track where each notarized document currently is — update without editing the whole record.</p>
    </header>

    <div class="row track-tools">
      <div class="tabs" id="tabs" style="margin:0;"></div>
      <div class="search-box track-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="trackSearch" placeholder="Search document number, type, or client name…">
      </div>
    </div>

    <div class="bulk-bar card" id="bulkBar">
      <span class="sel-count" id="selCount">0 selected</span>
      <div class="bulk-actions">
        <button class="btn btn-primary btn-sm" id="bulkOpen" disabled>Bulk Update</button>
        <button class="btn btn-outline btn-sm" id="bulkClearSel" disabled>Clear Selection</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="col-check"><input type="checkbox" id="checkAll" title="Select all displayed records"></th>
            <th>Document No.</th><th>Type</th><th>Client Name</th><th>Date Notarized</th>
            <th style="width:170px;">Status</th><th style="width:190px;">Location</th><th style="width:78px;">Actions</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="page-info" id="pageInfo"></span>
        <div class="pages" id="pageBtns"></div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<!-- Bulk Update dialog: choose status → location fills automatically → confirm -->
<div class="modal-overlay" id="bulkOverlay">
  <div class="modal modal-confirm">
    <div id="bulkIcon" style="width:40px;height:40px;border-radius:50%;background:rgba(197,164,93,.16);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:12px;"></div>
    <h3>Bulk Update</h3>
    <p id="bulkSummary"></p>
    <div class="bulk-modal-field">
      <label for="modalStatus">New Status</label>
      <select class="input" id="modalStatus"><option value="">Choose status…</option></select>
    </div>
    <div class="bulk-modal-field">
      <label for="modalLoc">Location (auto)</label>
      <input class="input loc-auto" id="modalLoc" placeholder="—" disabled>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px;">
      <button type="button" class="btn btn-outline" id="bulkCancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="bulkConfirm" disabled>Update records</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
initShell();
let page = 1, activeStatus = '', search = '';
const LIMIT = 10;
const tbody = document.getElementById('tbody');
const selected = new Set();   /* record ids checked — kept across pages and filters */

document.getElementById('modalStatus').innerHTML = `<option value="">Choose status…</option>` +
  STATUSES.map(s => `<option>${s}</option>`).join('');
document.getElementById('bulkIcon').innerHTML = ICONS.doc;

async function loadCounts() {
  let all, per = {};
  try {
    all = await api('/api/records?limit=1&page=1');
    for (const s of STATUSES) per[s] = (await api(`/api/records?status=${encodeURIComponent(s)}&limit=1&page=1&search=${encodeURIComponent(search)}`)).total;
  } catch (err) { return; }
  const tabs = [['', all.total], ...STATUSES.map(s => [s, per[s]])];
  document.getElementById('tabs').innerHTML = tabs.map(([key, n]) =>
    `<button type="button" class="tab ${key === activeStatus ? 'active' : ''}" data-key="${key}">
      ${key || 'All Documents'} <span class="count">${n.toLocaleString()}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    activeStatus = t.dataset.key; page = 1;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    load();
  }));
}

function updateSelectionUI() {
  const n = selected.size;
  document.getElementById('selCount').textContent = `${n} selected`;
  /* Bulk Update arms as soon as something is selected — the status is chosen inside the dialog */
  document.getElementById('bulkOpen').disabled = !n;
  document.getElementById('bulkClearSel').disabled = !n;
}

/* ---- Bulk Update dialog: select records → Bulk Update → choose status → confirm ---- */
const bulkOverlay = document.getElementById('bulkOverlay');
const modalStatus = document.getElementById('modalStatus');
const modalLoc = document.getElementById('modalLoc');
modalStatus.addEventListener('change', () => {
  modalLoc.value = STATUS_LOCATION[modalStatus.value] || '';
  document.getElementById('bulkConfirm').disabled = !modalStatus.value;
});
document.getElementById('bulkOpen').addEventListener('click', () => {
  if (!selected.size) return toast('Select at least one record first', true);
  const n = selected.size;
  document.getElementById('bulkSummary').textContent =
    `${n} record${n > 1 ? 's are' : ' is'} selected. Choose the new status — the matching location is set automatically.`;
  modalStatus.value = ''; modalLoc.value = '';
  document.getElementById('bulkConfirm').disabled = true;
  bulkOverlay.classList.add('open');
});
const closeBulk = () => bulkOverlay.classList.remove('open');
document.getElementById('bulkCancel').addEventListener('click', closeBulk);
bulkOverlay.addEventListener('click', e => { if (e.target === bulkOverlay) closeBulk(); });
document.getElementById('bulkClearSel').addEventListener('click', () => {
  selected.clear();
  tbody.querySelectorAll('.row-check').forEach(c => {
    c.checked = false; c.closest('tr').classList.remove('row-selected');
  });
  syncCheckAll(); updateSelectionUI();
});
document.getElementById('bulkConfirm').addEventListener('click', async () => {
  const btn = document.getElementById('bulkConfirm');
  const status = modalStatus.value;
  if (!status) return toast('Choose the new status first', true);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>&nbsp; Updating…';
  try {
    const res = await api('/api/records/bulk-track', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [...selected], status })
    });
    closeBulk();
    toast(`${res.updated} record${res.updated === 1 ? '' : 's'} updated — "${res.status}" · ${res.location}`);
    selected.clear();
    updateSelectionUI();
    loadCounts(); load();
  } catch (err) {
    toast(err.message, true);
  }
  btn.disabled = false;
  btn.textContent = 'Update records';
});

/* ---- row checkboxes + select-all (selects the records currently displayed) ---- */
function syncCheckAll() {
  const boxes = [...tbody.querySelectorAll('.row-check')];
  const all = document.getElementById('checkAll');
  all.disabled = boxes.length === 0;
  const checked = boxes.filter(b => b.checked).length;
  all.checked = boxes.length > 0 && checked === boxes.length;
  all.indeterminate = checked > 0 && checked < boxes.length;
}
document.getElementById('checkAll').addEventListener('change', e => {
  const on = e.target.checked;
  tbody.querySelectorAll('.row-check').forEach(c => {
    c.checked = on;
    const id = +c.dataset.id;
    if (on) selected.add(id); else selected.delete(id);
    c.closest('tr').classList.toggle('row-selected', on);
  });
  syncCheckAll(); updateSelectionUI();
});

/* ---- search: document number / document type / client name ---- */
let searchTimer;
function applySearch(v) { search = v.trim(); page = 1; load(); }
document.getElementById('trackSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => applySearch(e.target.value), 320);
});
document.getElementById('trackSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); applySearch(e.target.value); }
});

async function load() {
  tbody.innerHTML = skeletonRows(7);
  document.getElementById('checkAll').disabled = true;
  let data;
  try {
    data = await api(`/api/records?status=${encodeURIComponent(activeStatus)}&search=${encodeURIComponent(search)}&page=${page}&limit=${LIMIT}`);
  } catch (err) {
    tbody.innerHTML = stateRow('Could not load records', '<div style="margin-bottom:6px;">⚠️</div>');
    syncCheckAll();
    return;
  }
  tbody.innerHTML = data.rows.length ? data.rows.map(r => `
    <tr class="${selected.has(+r.id) ? 'row-selected' : ''}">
      <td class="col-check"><input type="checkbox" class="row-check" data-id="${r.id}" ${selected.has(+r.id) ? 'checked' : ''}></td>
      <td><span class="doc-no">${esc(r.doc_number)}</span></td>
      <td>${esc(r.doc_type)}</td>
      <td>${esc(r.client_name)}</td>
      <td>${fmtDate(r.date_notarized)}</td>
      <td>
        <select class="input status-select" data-id="${r.id}">
          ${STATUSES.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>
        <input class="input loc-auto" data-id="${r.id}" value="${esc(STATUS_LOCATION[r.status] || r.location || '')}"
          title="Location follows the status" disabled>
      </td>
      <td><div class="actions">
        <a class="icon-btn" title="Edit record" href="add-record.html?id=${r.id}">${ICONS.edit}</a>
      </div></td>
    </tr>`).join('')
    : stateRow(search ? 'No records match your search' : 'No documents with this status',
      ICONS.inbox.replace('viewBox', 'width="30" height="30" viewBox'));

  const from = data.total === 0 ? 0 : (data.page - 1) * LIMIT + 1;
  const to = Math.min(data.page * LIMIT, data.total);
  document.getElementById('pageInfo').textContent = data.total ? `Showing ${from}–${to} of ${data.total.toLocaleString()} document(s)` : '';
  const div = document.getElementById('pageBtns');
  if (data.pages > 1) {
    let btns = `<button class="arrow" ${data.page <= 1 ? 'disabled' : ''} data-page="${data.page - 1}">‹</button>`;
    const start = Math.max(1, data.page - 2), end = Math.min(data.pages, start + 4);
    const s = Math.max(1, Math.min(start, end - 4));
    for (let i = s; i <= end; i++) btns += `<button ${i === data.page ? 'class="cur"' : ''} data-page="${i}">${i}</button>`;
    btns += `<button class="arrow" ${data.page >= data.pages ? 'disabled' : ''} data-page="${data.page + 1}">›</button>`;
    div.innerHTML = btns;
    div.querySelectorAll('button:not([disabled])').forEach(b => b.addEventListener('click', () => { page = +b.dataset.page; load(); }));
  } else div.innerHTML = '';

  /* checkboxes for the rows just rendered — ticked ones come from earlier pages */
  tbody.querySelectorAll('.row-check').forEach(c => c.addEventListener('change', () => {
    const id = +c.dataset.id;
    c.checked ? selected.add(id) : selected.delete(id);
    c.closest('tr').classList.toggle('row-selected', c.checked);
    syncCheckAll(); updateSelectionUI();
  }));
  syncCheckAll(); updateSelectionUI();

  /* inline status update via the tracking endpoint — the location follows automatically */
  tbody.querySelectorAll('.status-select').forEach(sel => sel.addEventListener('change', async () => {
    try {
      const res = await api(`/api/records/${sel.dataset.id}/track`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: sel.value })
      });
      const locInput = tbody.querySelector(`.loc-auto[data-id="${sel.dataset.id}"]`);
      if (locInput) locInput.value = res.location;
      toast(`Status updated to "${res.status}" · ${res.location}`);
      loadCounts();
    } catch (err) { toast(err.message, true); }
  }));
}
loadCounts().then(load);
</script>
</body>
</html>
